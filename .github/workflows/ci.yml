name: FX1 Firmware CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - platformio.ini
      - '**/*.py'
      - '**/*.csv'
      - src/**
      - include/**
      - lib/**
      - data/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - platformio.ini
      - '**/*.py'
      - '**/*.csv'
      - src/**
      - include/**
      - lib/**
      - data/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: python -m pip install platformio
      - name: Build ESP32_2432S028_2USB
        run: pio run -e ESP32_2432S028_2USB
